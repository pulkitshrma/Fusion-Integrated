name: ELM schema sync (temporary)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [feature/employee-leave-management]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/employee-leave-management
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v3
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Regenerate OpenAPI schema
        run: .venv/bin/python manage.py spectacular --file openapi/fusion-integrated.v1.yaml
      - name: Commit generated schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi/fusion-integrated.v1.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate OpenAPI schema for ELM"
            git push origin HEAD:feature/employee-leave-management
          fi
